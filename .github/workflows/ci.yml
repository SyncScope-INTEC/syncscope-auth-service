name: CI/CD Pipeline

on:
  push:
    branches: [dev, qa, prod]
  pull_request:
    branches: [dev, qa, prod]

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_syncscope
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up test environment
        env:
          SECRET_KEY: "test-secret-key-for-ci"
          DEBUG: "True"
          DB_NAME: "test_syncscope"
          DB_USER: "postgres"
          DB_PASSWORD: "postgres"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "test-jwt-secret"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
        run: |
          # Verify database connection and settings
          python manage.py setup_ci_db

          # Run migrations to create all required tables
          python manage.py migrate

      - name: Run linting
        run: |
          # Install linting tools if not in requirements
          pip install black isort

          # Check code formatting
          black --check --diff .

          # Check import sorting
          isort --check-only --diff .
      - name: Run tests
        env:
          SECRET_KEY: "test-secret-key-for-ci"
          DEBUG: "True"
          DB_NAME: "test_syncscope"
          DB_USER: "postgres"
          DB_PASSWORD: "postgres"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "test-jwt-secret"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
        run: |
          # Run tests with coverage
          coverage run --source='.' manage.py test
          coverage report
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Security check
        continue-on-error: true
        run: |
          # Install security tools
          pip install safety bandit

          # Check for known security vulnerabilities
          safety check

          # Run bandit security linter
          bandit -r . -x tests/

      - name: Build check
        env:
          SECRET_KEY: "test-secret-key-for-ci"
          DEBUG: "True"
          DB_NAME: "test_syncscope"
          DB_USER: "postgres"
          DB_PASSWORD: "postgres"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "test-jwt-secret"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
        run: |
          # Collect static files
          python manage.py collectstatic --noinput

          # Check if Django can start (skip deploy checks in debug mode)
          python manage.py check

          # Generate OpenAPI schema
          python manage.py spectacular --file schema.yml

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: schema.yml
