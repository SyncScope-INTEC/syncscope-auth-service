name: CI/CD Pipeline

on:
  push:
    branches: [dev, qa, prod]
  pull_request:
    branches: [dev, qa, prod]

env:
  PYTHON_VERSION: "3.11"

# Add permissions for the workflow
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_syncscope
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up test environment
        env:
          SECRET_KEY: "test-secret-key-for-ci"
          DEBUG: "True"
          DB_NAME: "test_syncscope"
          DB_USER: "postgres"
          DB_PASSWORD: "postgres"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "test-jwt-secret"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
        run: |
          # Set up database for CI with enhanced error handling
          python manage.py setup_ci_db --force-public-schema --run-migrations

          # Verify the setup worked
          python manage.py check_db_health --retry-count=3

      - name: Run linting
        run: |
          # Install linting tools if not in requirements
          pip install black isort

          # Check code formatting
          black --check --diff .

          # Check import sorting
          isort --check-only --diff .
      - name: Get changed files (PR only)
        if: github.event_name == 'pull_request'
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            **/*.py
          files_ignore: |
            migrations/**
            tests/**
            manage.py
            __pycache__/**

      - name: Run tests with differential coverage (PR)
        if: github.event_name == 'pull_request'
        env:
          SECRET_KEY: "test-secret-key-for-ci"
          DEBUG: "True"
          DB_NAME: "test_syncscope"
          DB_USER: "postgres"
          DB_PASSWORD: "postgres"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "test-jwt-secret"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
        run: |
          # Install diff-cover for differential coverage
          pip install diff-cover
          
          # Run all tests but generate coverage
          coverage run -m pytest tests/ --ds=config.settings
          coverage xml
          
          # Generate differential coverage report only for changed files
          if [ "${{ steps.changed-files.outputs.any_changed }}" == "true" ]; then
            echo "Changed Python files:"
            echo "${{ steps.changed-files.outputs.all_changed_files }}"
            
            # Generate diff coverage report
            diff-cover coverage.xml --compare-branch=origin/main --fail-under=80 --show-uncovered
          else
            echo "No Python files changed, skipping differential coverage"
          fi

      - name: Run tests with full coverage (Push to main)
        if: github.event_name == 'push'
        env:
          SECRET_KEY: "test-secret-key-for-ci"
          DEBUG: "True"
          DB_NAME: "test_syncscope"
          DB_USER: "postgres"
          DB_PASSWORD: "postgres"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "test-jwt-secret"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
        run: |
          # Run tests with full coverage
          coverage run -m pytest tests/ --ds=config.settings
          coverage report
          coverage xml

      - name: Check coverage threshold
        id: coverage_check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # For PRs, differential coverage was already checked by diff-cover
            # Extract overall coverage for reporting
            if coverage report > /dev/null 2>&1; then
              COVERAGE=$(coverage report | grep TOTAL | awk '{print $4}' | sed 's/%//')
              echo "Overall coverage: ${COVERAGE}%"
              echo "coverage=${COVERAGE}" >> $GITHUB_OUTPUT
              echo "status=passed" >> $GITHUB_OUTPUT
              echo "type=differential" >> $GITHUB_OUTPUT
              echo "✅ Differential coverage check completed for changed files (80% threshold)"
            else
              echo "coverage=N/A" >> $GITHUB_OUTPUT
              echo "status=passed" >> $GITHUB_OUTPUT
              echo "type=differential" >> $GITHUB_OUTPUT
              echo "✅ No Python files changed, differential coverage not required"
            fi
          else
            # For pushes to main, check full coverage
            COVERAGE=$(coverage report | grep TOTAL | awk '{print $4}' | sed 's/%//')
            echo "Full coverage: ${COVERAGE}%"
            echo "coverage=${COVERAGE}" >> $GITHUB_OUTPUT
            echo "type=full" >> $GITHUB_OUTPUT

            if ! python -c "import sys; sys.exit(0 if float('${COVERAGE}') >= 80 else 1)"; then
              echo "❌ Coverage is ${COVERAGE}%, which is below the required 80% threshold"
              echo "Please add more tests to improve coverage"
              echo "status=failed" >> $GITHUB_OUTPUT
              exit 1
            else
              echo "✅ Coverage is ${COVERAGE}%, which meets the 80% threshold"
              echo "status=passed" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Comment coverage report on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const coverage = '${{ steps.coverage_check.outputs.coverage }}';
            const status = '${{ steps.coverage_check.outputs.status }}';
            const emoji = status === 'passed' ? '✅' : '❌';
            const statusText = status === 'passed' ? 'PASSED' : 'FAILED';

            // Get the coverage report
            const { execSync } = require('child_process');
            let coverageReport;
            try {
              coverageReport = execSync('coverage report', { encoding: 'utf8' });
            } catch (error) {
              coverageReport = 'Unable to generate coverage report';
            }

            const coverageType = '${{ steps.coverage_check.outputs.type }}';
            const isChanged = '${{ steps.changed-files.outputs.any_changed }}' === 'true';
            
            let comment;
            if (coverageType === 'differential') {
              if (isChanged) {
                comment = `## ${emoji} Differential Coverage Report - ${statusText}

                **🎯 Coverage Check**: Only modified files are checked for 80% coverage requirement
                **📊 Overall Project Coverage**: ${coverage}%

                ${status === 'passed' ? '✅ All modified files meet the 80% coverage requirement' : '❌ Some modified files are below the 80% coverage requirement'}

                <details>
                <summary>📊 Changed Files Coverage Report</summary>

                This PR was checked using **differential coverage** - only the modified files need to meet the 80% threshold.

                \`\`\`
                ${coverageReport}
                \`\`\`

                </details>

                ${status === 'failed' ? '⚠️ **Action Required:** Please add tests for the modified files to achieve 80% coverage' : '🎉 Great job! All modified files have adequate test coverage'}
                `;
              } else {
                comment = `## ✅ Coverage Report - PASSED

                **🎯 Coverage Check**: No Python files were modified in this PR
                **📊 Overall Project Coverage**: ${coverage}%

                ✅ No coverage check required as no Python source files were changed.

                🎉 This PR only contains non-Python changes (documentation, configuration, etc.)
                `;
              }
            } else {
              comment = `## ${emoji} Full Coverage Report - ${statusText}

                **📊 Full Project Coverage**: ${coverage}%
                ${status === 'passed' ? '✅ Meets the 80% threshold requirement' : '❌ Below the 80% threshold requirement'}

                <details>
                <summary>📊 Detailed Coverage Report</summary>

                \`\`\`
                ${coverageReport}
                \`\`\`

                </details>

                ${status === 'failed' ? '⚠️ **Action Required:** Please add more tests to improve coverage above 80%' : '🎉 Great job maintaining good test coverage!'}
                `;
            }

            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
              console.log('✅ Coverage comment posted successfully');
            } catch (error) {
              console.log('⚠️ Failed to post comment:', error.message);
              console.log('Coverage: ' + coverage + '%');
            }

      - name: Add coverage to job summary
        if: always()
        run: |
          COVERAGE="${{ steps.coverage_check.outputs.coverage }}"
          STATUS="${{ steps.coverage_check.outputs.status }}"
          TYPE="${{ steps.coverage_check.outputs.type }}"
          IS_CHANGED="${{ steps.changed-files.outputs.any_changed }}"

          if [ "$STATUS" = "passed" ]; then
            EMOJI="✅"
            STATUS_TEXT="PASSED"
          else
            EMOJI="❌"
            STATUS_TEXT="FAILED"
          fi

          if [ "$TYPE" = "differential" ]; then
            if [ "$IS_CHANGED" = "true" ]; then
              echo "## ${EMOJI} Differential Coverage Report - ${STATUS_TEXT}" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**🎯 Coverage Check**: Only modified files checked for 80% threshold" >> $GITHUB_STEP_SUMMARY
              echo "**📊 Overall Project Coverage**: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              if [ "$STATUS" = "passed" ]; then
                echo "✅ All modified files meet the 80% coverage requirement" >> $GITHUB_STEP_SUMMARY
              else
                echo "❌ Some modified files are below the 80% coverage requirement" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "## ✅ Coverage Report - PASSED" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**🎯 Coverage Check**: No Python files were modified" >> $GITHUB_STEP_SUMMARY
              echo "**📊 Overall Project Coverage**: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "✅ No coverage check required as no Python source files were changed" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "## ${EMOJI} Full Coverage Report - ${STATUS_TEXT}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**📊 Full Project Coverage**: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "$STATUS" = "passed" ]; then
              echo "✅ Meets the 80% threshold requirement" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ Below the 80% threshold requirement" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>📊 Detailed Coverage Report</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          if coverage report > /dev/null 2>&1; then
            coverage report >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage report not available" >> $GITHUB_STEP_SUMMARY
          fi
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Security check
        continue-on-error: true
        run: |
          # Install security tools
          pip install safety bandit

          # Check for known security vulnerabilities using the new scan command
          safety scan --json || safety check --json || echo "Security scan completed with warnings"

          # Run bandit security linter
          bandit -r . -x tests/ -f json || echo "Bandit scan completed with warnings"

      - name: Build check
        env:
          SECRET_KEY: "test-secret-key-for-ci"
          DEBUG: "True"
          DB_NAME: "test_syncscope"
          DB_USER: "postgres"
          DB_PASSWORD: "postgres"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "test-jwt-secret"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
        run: |
          # Collect static files
          python manage.py collectstatic --noinput

          # Check if Django can start (skip deploy checks in debug mode)
          python manage.py check

          # Generate OpenAPI schema
          python manage.py spectacular --file schema.yml

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: schema.yml
