name: CI/CD Pipeline

on:
  push:
    branches: [dev, qa, prod]
  pull_request:
    branches: [dev, qa, prod]

env:
  PYTHON_VERSION: "3.11"

# Add permissions for the workflow
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_syncscope
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up test environment
        env:
          SECRET_KEY: "test-secret-key-for-ci"
          DEBUG: "True"
          DB_NAME: "test_syncscope"
          DB_USER: "postgres"
          DB_PASSWORD: "postgres"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "test-jwt-secret"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
        run: |
          # Set up database for CI with enhanced error handling
          python manage.py setup_ci_db --force-public-schema --run-migrations

          # Verify the setup worked
          python manage.py check_db_health --retry-count=3

      - name: Run linting
        run: |
          # Install linting tools if not in requirements
          pip install black isort

          # Check code formatting
          black --check --diff .

          # Check import sorting
          isort --check-only --diff .
      - name: Run tests
        env:
          SECRET_KEY: "test-secret-key-for-ci"
          DEBUG: "True"
          DB_NAME: "test_syncscope"
          DB_USER: "postgres"
          DB_PASSWORD: "postgres"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "test-jwt-secret"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
        run: |
          # Run tests with coverage
          coverage run -m pytest tests/ --ds=config.settings
          coverage report
          coverage xml

      - name: Check coverage threshold
        id: coverage_check
        run: |
          # Extract coverage percentage and fail if below 80%
          COVERAGE=$(coverage report | grep TOTAL | awk '{print $4}' | sed 's/%//')
          echo "Current coverage: ${COVERAGE}%"
          echo "coverage=${COVERAGE}" >> $GITHUB_OUTPUT

          if ! python -c "import sys; sys.exit(0 if float('${COVERAGE}') >= 80 else 1)"; then
            echo "❌ Coverage is ${COVERAGE}%, which is below the required 80% threshold"
            echo "Please add more tests to improve coverage"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "✅ Coverage is ${COVERAGE}%, which meets the 80% threshold"
            echo "status=passed" >> $GITHUB_OUTPUT
          fi

      - name: Comment coverage report on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const coverage = '${{ steps.coverage_check.outputs.coverage }}';
            const status = '${{ steps.coverage_check.outputs.status }}';
            const emoji = status === 'passed' ? '✅' : '❌';
            const statusText = status === 'passed' ? 'PASSED' : 'FAILED';

            // Get the coverage report
            const { execSync } = require('child_process');
            let coverageReport;
            try {
              coverageReport = execSync('coverage report', { encoding: 'utf8' });
            } catch (error) {
              coverageReport = 'Unable to generate coverage report';
            }

            const comment = `## ${emoji} Coverage Report - ${statusText}

            **Current Coverage: ${coverage}%**
            ${status === 'passed' ? '✅ Meets the 80% threshold requirement' : '❌ Below the 80% threshold requirement'}

            <details>
            <summary>📊 Detailed Coverage Report</summary>

            \`\`\`
            ${coverageReport}
            \`\`\`

            </details>

            ${status === 'failed' ? '⚠️ **Action Required:** Please add more tests to improve coverage above 80%' : '🎉 Great job maintaining good test coverage!'}
            `;

            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
              console.log('✅ Coverage comment posted successfully');
            } catch (error) {
              console.log('⚠️ Failed to post comment:', error.message);
              console.log('Coverage: ' + coverage + '%');
            }

      - name: Add coverage to job summary
        if: always()
        run: |
          COVERAGE="${{ steps.coverage_check.outputs.coverage }}"
          STATUS="${{ steps.coverage_check.outputs.status }}"

          if [ "$STATUS" = "passed" ]; then
            EMOJI="✅"
            STATUS_TEXT="PASSED"
          else
            EMOJI="❌"
            STATUS_TEXT="FAILED"
          fi

          echo "## ${EMOJI} Coverage Report - ${STATUS_TEXT}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Current Coverage: ${COVERAGE}%**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$STATUS" = "passed" ]; then
            echo "✅ Meets the 80% threshold requirement" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Below the 80% threshold requirement" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>📊 Detailed Coverage Report</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          coverage report >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Security check
        continue-on-error: true
        run: |
          # Install security tools
          pip install safety bandit

          # Check for known security vulnerabilities
          safety check

          # Run bandit security linter
          bandit -r . -x tests/

      - name: Build check
        env:
          SECRET_KEY: "test-secret-key-for-ci"
          DEBUG: "True"
          DB_NAME: "test_syncscope"
          DB_USER: "postgres"
          DB_PASSWORD: "postgres"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "test-jwt-secret"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
        run: |
          # Collect static files
          python manage.py collectstatic --noinput

          # Check if Django can start (skip deploy checks in debug mode)
          python manage.py check

          # Generate OpenAPI schema
          python manage.py spectacular --file schema.yml

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: schema.yml
