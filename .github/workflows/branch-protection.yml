name: Branch Protection

on:
  pull_request:
    branches:
      - prod
      - production
      - main
      - master
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  enforce-branch-protection:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check target branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const targetBranch = context.payload.pull_request.base.ref;
            const sourceBranch = context.payload.pull_request.head.ref;
            const prNumber = context.payload.pull_request.number;
            const isDraft = context.payload.pull_request.draft;
            
            console.log(`Target branch: ${targetBranch}`);
            console.log(`Source branch: ${sourceBranch}`);
            console.log(`PR #${prNumber}`);
            console.log(`Draft: ${isDraft}`);
            
            // Protected branches that require special handling
            const protectedBranches = ['prod', 'production', 'main', 'master'];
            
            if (protectedBranches.includes(targetBranch)) {
              console.log(`This PR targets a protected branch: ${targetBranch}`);
              
              // Add a comment explaining the protection rules
              const commentBody = `🛡️ **Protected Branch Warning**
              
            This PR targets the protected branch \`${targetBranch}\`. Please ensure:

            - [ ] 🔍 **Code Review**: Manual review and approval required
            - [ ] 🧪 **Testing**: All tests must pass
            - [ ] 📋 **Documentation**: README and docs updated if needed  
            - [ ] 🚀 **Deployment**: Deployment plan confirmed
            - [ ] 🔒 **Security**: Security implications reviewed

            **⚠️ Important**: Changes to \`${targetBranch}\` require careful review and approval from code owners.

            ---
            *This comment was automatically generated by GitHub Actions.*`;

              // Check if we already commented
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber
              });
              
              const existingComment = comments.data.find(comment => 
                comment.body.includes('Protected Branch Warning') && comment.user.type === 'Bot'
              );
              
              if (!existingComment) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: commentBody
                });
                console.log('Added protection warning comment');
              } else {
                console.log('Protection warning comment already exists');
              }
            }

  security-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Security file check
        run: |
          echo "Checking for sensitive files..."
          
          # Check for common sensitive files
          sensitive_files=(
            ".env"
            "*.key"
            "*.pem"
            "*secret*"
            "*password*"
            "config/secrets.py"
          )
          
          found_sensitive=false
          
          for pattern in "${sensitive_files[@]}"; do
            if find . -name "$pattern" -type f | grep -v ".git" | head -1; then
              echo "Found potentially sensitive file: $pattern"
              found_sensitive=true
            fi
          done
          
          if [ "$found_sensitive" = true ]; then
            echo "Sensitive files detected. Please review carefully!"
          else
            echo "No obvious sensitive files detected"
          fi

  size-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Check PR size
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            
            const additions = pullRequest.additions;
            const deletions = pullRequest.deletions;
            const changedFiles = pullRequest.changed_files;
            
            console.log(`PR Stats: +${additions} -${deletions} lines, ${changedFiles} files`);
            
            // Define size thresholds
            const LARGE_PR_THRESHOLD = 500;
            const HUGE_PR_THRESHOLD = 1000;
            const TOO_MANY_FILES = 20;
            
            let warningMessage = '';
            
            if (additions > HUGE_PR_THRESHOLD) {
              warningMessage += `🚨 **Huge PR**: This PR adds ${additions} lines of code. Consider splitting it into smaller PRs.\n\n`;
            } else if (additions > LARGE_PR_THRESHOLD) {
              warningMessage += `⚠️ **Large PR**: This PR adds ${additions} lines of code. Please ensure thorough review.\n\n`;
            }
            
            if (changedFiles > TOO_MANY_FILES) {
              warningMessage += `📁 **Many files changed**: This PR modifies ${changedFiles} files. Please ensure all changes are related.\n\n`;
            }
            
            if (warningMessage) {
              warningMessage += '---\n*This analysis was generated by GitHub Actions.*';
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: warningMessage
              });
            }