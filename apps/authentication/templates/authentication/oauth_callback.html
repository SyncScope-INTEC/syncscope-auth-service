{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SyncScope Agent Login</title>
    <link
      rel="icon"
      href="{% static 'authentication/images/icon.ico' %}"
      type="image/x-icon"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Amazon Ember", "Segoe UI", sans-serif;
        background: #f5f6f8;
        color: #0f1111;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
      }

      .card-wrapper {
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
      }

      .card {
        background: #fff;
        border-radius: 16px;
        padding: 40px 32px;
        width: 100%;
        text-align: center;
        box-shadow: 0 18px 40px rgba(15, 17, 17, 0.12);
        border: 1px solid #d5dbdb;
      }

      .logo {
        max-width: 180px;
        height: auto;
        margin: 0 auto 24px;
        display: block;
        image-rendering: -webkit-optimize-contrast;
        object-fit: contain;
      }

      .badge {
        width: 88px;
        height: 88px;
        margin: 0 auto 24px;
        border-radius: 50%;
        border: 4px solid #00a650;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(145deg, #f3fdfa, #e8f5ef);
      }

      .badge svg {
        width: 40px;
        height: 40px;
        fill: none;
        stroke: #00751f;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      h1 {
        font-size: 1.75rem;
        font-weight: 600;
        margin-bottom: 12px;
      }

      .subtitle {
        font-size: 1rem;
        color: #5f6a6a;
        margin-bottom: 28px;
      }

      .panel {
        background: #f8fbfd;
        border: 1px solid #d5e3ec;
        border-radius: 12px;
        padding: 20px 24px;
        text-align: left;
        margin-bottom: 20px;
      }

      .panel strong {
        display: block;
        font-size: 0.95rem;
        margin-bottom: 8px;
      }

      .panel p {
        margin: 0;
        font-size: 0.95rem;
        color: #374151;
      }

      .hint {
        font-size: 0.9rem;
        color: #6b7280;
        margin-top: 16px;
      }

      .footer {
        margin-top: 36px;
        font-size: 0.85rem;
        color: #9ca3af;
      }

      @media (max-width: 520px) {
        .card {
          padding: 32px 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-wrapper">
        <img
          src="{% static 'authentication/images/SyncScope Logo.png' %}"
          alt="SyncScope logo"
          class="logo"
        />

        <div class="badge" role="img" aria-label="Success">
          <svg viewBox="0 0 64 64">
            <path d="M16 33l8.5 8.5L48 18" />
          </svg>
        </div>

        <h1>Request approved</h1>
        <p class="subtitle">
          SyncScope Agent now has access to your GitHub data.
        </p>

        <div class="panel">
          <strong>You can close this window.</strong>
          <p>
            Your desktop agent will automatically continue once it detects this
            approval.
          </p>
        </div>

        <div class="footer">Powered by SyncScope • Secure Auth Flow</div>
      </div>
    </div>
  </body>
</html>
